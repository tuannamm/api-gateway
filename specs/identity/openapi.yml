            "type": "string",
            "minLength": 1,
            "maxLength": 255,
            "format": "email"
          },
          "firstName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "lastName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          }
        },
        "required": [
          "username",
          "email"
        ]
      },
      "UpdateUser": {
        "type": "object",
        "additionalProperties": false,
