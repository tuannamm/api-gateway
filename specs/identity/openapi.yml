        "type": "object",
        "additionalProperties": false,
        "properties": {
          "userId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "username": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "email": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255,
            "format": "email"
          },
