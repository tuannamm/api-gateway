            "maxLength": 128
          },
          "username": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "email": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255,
            "format": "email"
          },
          "firstName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "lastName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "enabled": {
            "type": "boolean"
          },
          "emailVerified": {
            "type": "boolean"
          },
          "roles": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "admin",
                "user"
              ]
            }
          }
        },
        "required": [
          "userId",
          "username",
          "enabled",
          "emailVerified",
          "roles"
        ]
      },
      "CreateUser": {
        "type": "object",
        "additionalProperties": false,
